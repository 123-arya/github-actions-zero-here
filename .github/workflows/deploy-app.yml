name: deploy the docker app

on:
    workflow_dispatch:

jobs:
    deploy:
    
        runs-on: self-hosted

        env:
            DOCKERHUB_USER: ${{ vars.DOCKERHUB_TOKEN }}

        steps:
            - name: Check the code
              uses: actions/checkout@v4

            - name: Deploy with docker compose
              run: docker compose up -d --build

